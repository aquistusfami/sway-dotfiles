# Fuzzel configuration - Acid Dark Theme
font=Geist:size=11, GeistMono Nerd Font:size=11, Font Awesome 6 Free:size=11
terminal=footclient
icon-theme=Papirus-Dark
prompt="> "
layer=overlay
lines=10
width=45
horizontal-pad=16
vertical-pad=10
inner-pad=6
exit-on-keyboard-focus-loss=no

[border]
width=2
radius=0
selection-radius=0

[colors]
background=282a36fa
text=eff0ebff
match=5af78eff
selection=444444ff
selection-text=eff0ebff
selection-match=f3f99dff
border=ff6ac1ff
