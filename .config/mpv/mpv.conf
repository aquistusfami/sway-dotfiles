# =============================================================================
# MPV CONFIGURATION - THINKPAD P14s GEN 5 AMD (Radeon 780M / 2.8K OLED)
# =============================================================================

# GPU Hardware Acceleration (Vulkan + VA-API)
vo=gpu-next
gpu-api=vulkan
hwdec=vaapi

# OLED Display & HDR Optimization (Bật sẵn giải mã HDR chuẩn 10-bit OLED)
target-colorspace-hint=yes
target-prim=dci-p3
target-trc=auto
target-contrast=inf
tone-mapping=auto
hdr-compute-peak=yes
dither-depth=10
dither=fruit

# Playback Behavior
force-window=immediate
save-position-on-quit=yes
keep-open=yes
autofit-larger=80%x80%
geometry=50%:50%

# Subtitles (Catppuccin Mocha Style)
slang=vi,vie,en,eng
alang=vi,vie,en,eng,ja,jpn
sub-auto=fuzzy
sub-font="GeistMono Nerd Font"
sub-font-size=40
sub-border-size=2.5
sub-color='#CDD6F4'
sub-border-color='#1E1E2E'
sub-shadow-offset=1

# Screenshots
screenshot-directory="~/Pictures"
screenshot-format=png
screenshot-template="MPV_%F_%P"

# Streaming & Cache
cache=yes
demuxer-max-bytes=150M
demuxer-max-back-bytes=50M

# Default Video Quality (Tự động chọn luồng 1440p/2.8K sắc nét cho màn OLED)
ytdl-format="bestvideo[height<=?1440]+bestaudio/best[height<=?1440]/bestvideo+bestaudio/best"
