<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- Map Inter to Inter Variable -->
    <match target="pattern">
        <test name="family"><string>Inter</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Inter Variable</string>
        </edit>
    </match>

    <!-- Default sans-serif font -->
    <match target="pattern">
        <test qual="any" name="family"><string>sans-serif</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Inter Variable</string>
            <string>Inter</string>
            <string>Roboto</string>
            <string>Noto Sans</string>
        </edit>
    </match>

    <!-- Alias Windows / Apple web fonts to Inter Variable & Roboto -->
    <match target="pattern">
        <test name="family"><string>Segoe UI</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Inter Variable</string>
            <string>Roboto</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>-apple-system</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Inter Variable</string>
            <string>Roboto</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>BlinkMacSystemFont</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Inter Variable</string>
            <string>Roboto</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>Helvetica Neue</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Inter Variable</string>
            <string>Roboto</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>Helvetica</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Inter Variable</string>
            <string>Roboto</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>Arial</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Inter Variable</string>
            <string>Roboto</string>
        </edit>
    </match>

    <!-- Default monospace font -->
    <match target="pattern">
        <test qual="any" name="family"><string>monospace</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>JetBrains Mono</string>
            <string>Roboto Mono</string>
        </edit>
    </match>

    <!-- Default Emoji font -->
    <match target="pattern">
        <test qual="any" name="family"><string>emoji</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Color Emoji</string>
        </edit>
    </match>

    <!-- Crisp Font Rendering (Anti-aliasing & Subpixel Hinting) -->
    <match target="font">
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        <edit name="hinting" mode="assign"><bool>true</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
        <edit name="rgba" mode="assign"><const>rgb</const></edit>
        <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    </match>
</fontconfig>
