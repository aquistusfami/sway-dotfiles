# Spotlight theme - macOS-like, minimal, translucent floating panel
font=Geist:size=13, GeistMono Nerd Font Mono:size=13
icon-theme=kora
terminal=foot

layer=overlay
anchor=top
y-margin=120
width=54
lines=9
horizontal-pad=22
vertical-pad=14
inner-pad=10
line-height=26
match-mode=fzf
exit-on-keyboard-focus-loss=yes

[border]
width=1
radius=16
selection-radius=10

[colors]
background=1c1c1ef2
text=e8e8edff
prompt=f3f99dff
input=f5f5f7ff
match=f3f99dff
selection=ffffff1f
selection-text=ffffffff
selection-match=f3f99dff
border=ffffff40
