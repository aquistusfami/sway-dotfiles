# TLP cho ThinkPad P14s Gen5 AMD — copy vào /etc/tlp.d/
# TLP 1.10: profile PRF dùng *_ON_AC, BAL dùng *_ON_BAT, SAV dùng *_ON_SAV (thiếu thì lấy *_ON_BAT).
#   Cắm sạc -> BAL (mát), rút sạc -> SAV (tiết kiệm pin), `perf` trong zsh -> PRF.
# AUTO_SWITCH=1: cắm/rút sạc luôn về profile mặc định, kể cả khi đang bật perf.
TLP_AUTO_SWITCH=1
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=SAV

# PRF — hiệu năng (chỉ khi bật `perf`)
PLATFORM_PROFILE_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_BOOST_ON_AC=1
PCIE_ASPM_ON_AC=default
WIFI_PWR_ON_AC=off

# BAL — cắm sạc, ưu tiên mát: tắt boost là phần giảm nhiệt chính
PLATFORM_PROFILE_ON_BAT=balanced
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
CPU_BOOST_ON_BAT=0
PCIE_ASPM_ON_BAT=powersave

# SAV — chạy pin
PLATFORM_PROFILE_ON_SAV=low-power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_BOOST_ON_SAV=0
PCIE_ASPM_ON_SAV=powersupersave

# Chung (BAL và SAV dùng *_ON_BAT)
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=auto
WIFI_PWR_ON_BAT=on
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
USB_AUTOSUSPEND=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER_ON_BAT=Y
SCHED_POWERSAVE_ON_BAT=1
NMI_WATCHDOG=0
WOL_DISABLE=Y
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
