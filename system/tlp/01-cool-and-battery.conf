# ==============================================================================
# TLP Optimization for ASUS VivoBook (Intel Core i3-8145U)
# Goal: Maximum cooling, silent fan, and battery longevity
# ==============================================================================

# 1. BATTERY CHARGE THRESHOLD (ASUS Battery Health Charging)
# Stop charging at 80% to protect the battery lifespan
STOP_CHARGE_THRESH_BAT0=90
RESTORE_THRESHOLDS_ON_BAT=1

# 2. CPU POWER MANAGEMENT (intel_pstate)
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Energy Performance Preference (EPP)
# balance_power on AC keeps CPU cool without lag; power on BAT maximizes battery
CPU_ENERGY_PERF_POLICY_ON_AC=balance_power
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Disable Turbo Boost (Prevents sudden spikes up to 3.9GHz & fan noise)
CPU_BOOST_ON_AC=0
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=0
CPU_HWP_DYN_BOOST_ON_BAT=0

# Limit maximum CPU frequency percentage
CPU_MAX_PERF_ON_AC=90
CPU_MAX_PERF_ON_BAT=70

# 3. GPU & BUS POWER SAVING
#INTEL_GPU_MIN_FREQ_ON_AC=300
#INTEL_GPU_MIN_FREQ_ON_BAT=300
#INTEL_GPU_BOOST_FREQ_ON_AC=600
#INTEL_GPU_BOOST_FREQ_ON_BAT=450

PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# 4. AUDIO & DRIVE POWER MANAGEMENT
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

